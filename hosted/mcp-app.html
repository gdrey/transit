<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transit Workbench</title>
<style>
body{margin:0;padding:14px;font:15px system-ui;color:CanvasText;background:Canvas;color-scheme:light dark}
h1{font:600 20px Georgia,serif;margin:0 0 10px}
.controls{display:flex;flex-wrap:wrap;align-items:end;gap:8px}
label{display:grid;gap:4px}input,select,button{font:inherit;padding:5px 8px;max-width:100%}
output{display:block;margin-top:10px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:5px;text-align:left;border-bottom:1px solid GrayText}
td{font-family:monospace}
</style>
</head>
<body>
<h1>Transit Workbench</h1>
<div class="controls">
  <label>Route <select id="route" disabled></select></label>
  <label>Service date <input id="date" type="date"></label>
  <button id="schedule" disabled>Show trips</button>
  <button id="review" disabled>Review output</button>
  <button id="open" disabled>Open workbench</button>
</div>
<output id="status" role="status">Connecting to the temporary session…</output>
<div id="results"></div>
<script>
(() => {
    const element = id => document.getElementById(id);
    const send = (message) => parent.postMessage({jsonrpc:'2.0',...message},'*');
    const pending = new Map();
    let nextId=0;
    function request(method,params) {
        return new Promise((resolve,reject) => {
            const id=++nextId;
            const timer=setTimeout(() => { pending.delete(id); reject(Error('The chat did not respond.')); },30000);
            pending.set(id,{resolve,reject,timer});
            send({id,method,params});
        });
    }
    addEventListener('message',event => {
        if (event.source!==parent || event.data?.jsonrpc!=='2.0') return;
        const message=event.data;
        if (message.method==='ui/resource-teardown' && message.id!==undefined) {
            send({id:message.id,result:{}});
            return;
        }
        const waiter=pending.get(message.id);
        if (!waiter || (!('result' in message) && !('error' in message))) return;
        clearTimeout(waiter.timer);
        pending.delete(message.id);
        if (message.error) waiter.reject(Error(message.error.message || 'The chat returned an error.'));
        else waiter.resolve(message.result);
    });
    async function call(name,args={}) {
        const result=await request('tools/call',{name,arguments:args});
        const content=result.content?.find(item=>item.type==='text')?.text;
        if (result.isError) throw Error(content || 'Tool request failed.');
        if (result.structuredContent) return result.structuredContent;
        if (content) return JSON.parse(content);
        throw Error('The chat returned no result.');
    }
    async function action(button,run) {
        button.disabled=true;
        element('results').replaceChildren();
        element('status').textContent='Loading…';
        try { await run(); }
        catch (error) { element('status').textContent=error.message; }
        finally { button.disabled=false; }
    }
    function rows(headings,records) {
        const table=document.createElement('table');
        for (const [i,fields] of [headings,...records].entries()) {
            const row=table.insertRow();
            for (const field of fields) {
                const cell=document.createElement(i===0?'th':'td');
                cell.textContent=field || '—';
                row.append(cell);
            }
        }
        element('results').replaceChildren(table);
    }
    element('schedule').onclick = () => action(element('schedule'),async () => {
        if (!element('date').value) throw Error('Choose a service date.');
        const plan=await call('scheduled_trips',{route_id:element('route').value,service_date:element('date').value});
        element('status').textContent=plan.trip_count+' scheduled trip templates. Showing '+plan.trips.length+'.';
        rows(['Trip ID','Headsign','First departure'],plan.trips.map(trip=>[trip.trip_id,trip.trip_headsign,trip.first_departure]));
    });
    element('review').onclick = () => action(element('review'),async () => {
        const review=await call('review_output');
        element('status').textContent='Reviewed ZIP SHA-256\n'+review.output_sha256;
    });
    element('open').onclick=()=>request('ui/open-link',{url:'https://transit-workbench.vercel.app/'}).catch(error=>{
        element('status').textContent=error.message;
    });
    const today=new Date();
    element('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
    request('ui/initialize',{appInfo:{name:'Transit Workbench',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'})
        .then(async () => {
            send({method:'ui/notifications/initialized'});
            if (typeof ResizeObserver!=='undefined') new ResizeObserver(()=>{
                send({method:'ui/notifications/size-changed',params:{height:document.body.offsetHeight}});
            }).observe(document.body);
            element('review').disabled=false;
            element('open').disabled=false;
            const result=await call('list_routes');
            const routes=Array.isArray(result)?result:(result.result || []);
            element('route').replaceChildren(...routes.map(route=>new Option(route.route_short_name || route.route_id,route.route_id)));
            element('route').disabled=element('schedule').disabled=routes.length===0;
            element('status').textContent=routes.length?'Select a route and service date.':'Import a feed in the workbench first.';
        })
        .catch(error=>{ element('status').textContent=error.message; });
})();
</script>
</body>
</html>
